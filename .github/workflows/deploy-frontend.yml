name: Deploy Frontend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
      # they must be present in the environment of the build/deploy step itself.
      # Without them the bundle shipped `http://localhost:8000` as the API URL and
      # disabled auth, which made the deployed site look broken.
      - name: Deploy to Cloudflare Workers
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public backend URL. Falls back to the Render deployment defined in
          # frontend/lib/config.ts if this is not set.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://cutc-intelliapply.onrender.com' }}
          # Supabase project URL + publishable anon key (safe to expose to the
          # browser; RLS is what protects the data). Set these as repository
          # secrets to enable sign-in.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx @vinext/cloudflare deploy

      # RESEND_API_KEY is read at *runtime* by the /api/contact route handler, so
      # unlike the NEXT_PUBLIC_* values above it must live as a Worker secret
      # rather than be inlined into the bundle. Runs after deploy because the
      # Worker has to exist before a secret can be attached to it.
      - name: Sync contact-form secrets to the Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ vars.CONTACT_FROM_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️ RESEND_API_KEY not set — the contact form cannot send email." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The form still validates and, instead of failing silently, tells the visitor" >> "$GITHUB_STEP_SUMMARY"
            echo "delivery is unavailable and offers a pre-filled \`mailto:\` link." >> "$GITHUB_STEP_SUMMARY"
            echo "To enable sending, add the \`RESEND_API_KEY\` repository secret and re-run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          if [ -n "$CONTACT_TO_EMAIL" ]; then
            printf '%s' "$CONTACT_TO_EMAIL" | npx wrangler secret put CONTACT_TO_EMAIL
          fi
          if [ -n "$CONTACT_FROM_EMAIL" ]; then
            printf '%s' "$CONTACT_FROM_EMAIL" | npx wrangler secret put CONTACT_FROM_EMAIL
          fi
          echo "✅ Contact form email delivery configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Report auth configuration status
        if: always()
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "✅ Supabase auth configured — the Sign In button will open a working sign-in form." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Supabase auth NOT configured." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Sign In button is still visible, but it explains that accounts are unavailable." >> "$GITHUB_STEP_SUMMARY"
            echo "To enable sign-in, add these repository secrets and re-run:" >> "$GITHUB_STEP_SUMMARY"
            echo '  - `NEXT_PUBLIC_SUPABASE_URL`' >> "$GITHUB_STEP_SUMMARY"
            echo '  - `NEXT_PUBLIC_SUPABASE_ANON_KEY`' >> "$GITHUB_STEP_SUMMARY"
          fi
